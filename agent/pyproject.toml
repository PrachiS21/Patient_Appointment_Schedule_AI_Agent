[project]
name = "patient-intake-agent"
version = "0.1.0"
description = "Five-node LangGraph patient intake assistant, built on PatientAgentBench's healthcare sandbox and appointment tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-aws>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "patient-agent-bench",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

# Dev setup: PatientAgentBench is expected to be checked out as a sibling
# directory of this repo (see root README "Setup" section). To make this repo
# installable on its own (e.g. a fresh clone without the sibling checkout),
# swap this for a git source instead:
#   patient-agent-bench = { git = "https://github.com/amazon-science/PatientAgentBench.git" }
[tool.uv.sources]
patient-agent-bench = { path = "../../PatientAgentBench" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patient_intake_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
