[project]
name = "patient-intake-backend"
version = "0.1.0"
description = "FastAPI wrapper around patient-intake-agent: WebSocket chat endpoint + REST summary endpoint."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "patient-intake-agent",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
patient-intake-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
